name: Build Financial Tracker APK

# Berjalan otomatis setiap ada perubahan di repo,
# atau manual lewat tab Actions > Build Financial Tracker APK > Run workflow.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Ambil isi repo
        uses: actions/checkout@v4

      - name: Periksa index.html
        run: |
          if [ ! -f index.html ]; then
            echo "::error::index.html belum ada di folder utama repo. Upload index.html, lalu jalankan ulang."
            exit 1
          fi
          if ! grep -q "Android.updateWidget" index.html; then
            echo "::error::index.html ini belum versi yang terhubung ke widget. Pakai index.html dari Claude."
            exit 1
          fi

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Rakit proyek Android
        run: |
          set -e
          P=android-project
          mkdir -p "$P/app"
          cat > "$P/app/build.gradle" <<'FT_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.financialtracker'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.financialtracker'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          FT_EOF
          mkdir -p "$P/app/src/main"
          cat > "$P/app/src/main/AndroidManifest.xml" <<'FT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Sengaja TANPA izin INTERNET: aplikasi ini 100% offline -->

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout"
                      android:exported="true"
                      android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".BalanceWidgetProvider"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/balance_widget_info" />
                  </receiver>
              </application>

          </manifest>
          FT_EOF
          mkdir -p "$P/app/src/main/java/com/example/financialtracker"
          cat > "$P/app/src/main/java/com/example/financialtracker/BalanceWidgetProvider.java" <<'FT_EOF'
          package com.example.financialtracker;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.widget.RemoteViews;

          /**
           * Widget layar beranda "Sisa Saldo".
           * Datanya dibaca dari SharedPreferences yang diisi oleh MainActivity
           * (yang menerima kiriman dari JavaScript di index.html). Tanpa internet.
           */
          public class BalanceWidgetProvider extends AppWidgetProvider {

              public static final String PREFS_NAME = "financial_tracker_widget";
              public static final String KEY_BALANCE = "balance_text";

              private static final int COLOR_NORMAL = 0xFFFFFFFF;
              private static final int COLOR_NEGATIVE = 0xFFFFD1D9;

              /** Dipanggil sistem saat widget pertama kali dipasang atau perlu digambar ulang. */
              @Override
              public void onUpdate(Context context, AppWidgetManager manager, int[] appWidgetIds) {
                  for (int id : appWidgetIds) {
                      manager.updateAppWidget(id, buildViews(context));
                  }
              }

              /** Dipanggil MainActivity setiap kali saldo berubah, supaya semua widget ikut diperbarui. */
              public static void refreshAll(Context context) {
                  AppWidgetManager manager = AppWidgetManager.getInstance(context);
                  ComponentName component = new ComponentName(context, BalanceWidgetProvider.class);
                  int[] ids = manager.getAppWidgetIds(component);
                  for (int id : ids) {
                      manager.updateAppWidget(id, buildViews(context));
                  }
              }

              private static RemoteViews buildViews(Context context) {
                  SharedPreferences prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                  String balance = prefs.getString(KEY_BALANCE, "Rp 0");

                  RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.widget_balance);
                  views.setTextViewText(R.id.widget_balance, balance);
                  views.setTextColor(R.id.widget_balance, balance.startsWith("-") ? COLOR_NEGATIVE : COLOR_NORMAL);

                  // Ketuk widget untuk membuka aplikasi
                  Intent openApp = new Intent(context, MainActivity.class);
                  PendingIntent pending = PendingIntent.getActivity(
                          context, 0, openApp,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  views.setOnClickPendingIntent(R.id.widget_root, pending);

                  return views;
              }
          }
          FT_EOF
          mkdir -p "$P/app/src/main/java/com/example/financialtracker"
          cat > "$P/app/src/main/java/com/example/financialtracker/MainActivity.java" <<'FT_EOF'
          package com.example.financialtracker;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Context;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.WindowInsets;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          /**
           * Membuka index.html dari folder assets di dalam WebView (100% offline)
           * dan menyediakan jembatan "window.Android" untuk JavaScript.
           */
          public class MainActivity extends Activity {

              private static final String BG_COLOR = "#0f1420";
              private static final int MAX_TEXT_LENGTH = 40;

              private WebView webView;

              @SuppressLint({"SetJavaScriptEnabled", "AddJavascriptInterface"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  int bg = Color.parseColor(BG_COLOR);
                  getWindow().getDecorView().setBackgroundColor(bg);
                  getWindow().setStatusBarColor(bg);
                  getWindow().setNavigationBarColor(bg);

                  webView = new WebView(this);
                  webView.setBackgroundColor(bg);
                  setContentView(webView);

                  // Beri ruang untuk status bar / navigation bar (HP Android baru memakai layar penuh)
                  webView.setOnApplyWindowInsetsListener((view, insets) -> {
                      view.setPadding(
                              insets.getSystemWindowInsetLeft(),
                              insets.getSystemWindowInsetTop(),
                              insets.getSystemWindowInsetRight(),
                              insets.getSystemWindowInsetBottom());
                      return insets;
                  });

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true); // supaya localStorage berfungsi

                  // Hanya halaman lokal yang boleh dibuka
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return !request.getUrl().toString().startsWith("file:///android_asset/");
                      }
                  });

                  webView.addJavascriptInterface(new WidgetBridge(getApplicationContext()), "Android");
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }

              /** Jembatan yang dipanggil dari JavaScript: window.Android.updateWidget("Rp 150.000") */
              private static class WidgetBridge {
                  private final Context appContext;

                  WidgetBridge(Context appContext) {
                      this.appContext = appContext;
                  }

                  @JavascriptInterface
                  public void updateWidget(String balanceText) {
                      if (balanceText == null) {
                          return;
                      }
                      String text = balanceText.trim();
                      if (text.length() > MAX_TEXT_LENGTH) {
                          text = text.substring(0, MAX_TEXT_LENGTH);
                      }
                      appContext.getSharedPreferences(BalanceWidgetProvider.PREFS_NAME, Context.MODE_PRIVATE)
                              .edit()
                              .putString(BalanceWidgetProvider.KEY_BALANCE, text)
                              .apply();
                      BalanceWidgetProvider.refreshAll(appContext);
                  }
              }
          }
          FT_EOF
          mkdir -p "$P/app/src/main/res/drawable"
          cat > "$P/app/src/main/res/drawable/ic_launcher_foreground.xml" <<'FT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M30,66 h10 v12 h-10 z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M49,52 h10 v26 h-10 z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M68,36 h10 v42 h-10 z" />
          </vector>
          FT_EOF
          mkdir -p "$P/app/src/main/res/drawable"
          cat > "$P/app/src/main/res/drawable/widget_bg.xml" <<'FT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <gradient
                  android:angle="315"
                  android:endColor="#7C3AED"
                  android:startColor="#4F46E5"
                  android:type="linear" />
              <corners android:radius="20dp" />
          </shape>
          FT_EOF
          mkdir -p "$P/app/src/main/res/layout"
          cat > "$P/app/src/main/res/layout/widget_balance.xml" <<'FT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/widget_bg"
              android:gravity="center_vertical"
              android:orientation="vertical"
              android:padding="12dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="@string/widget_label"
                  android:textColor="#CCFFFFFF"
                  android:textSize="12sp" />

              <TextView
                  android:id="@+id/widget_balance"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="2dp"
                  android:autoSizeMaxTextSize="26sp"
                  android:autoSizeMinTextSize="12sp"
                  android:autoSizeStepGranularity="1sp"
                  android:autoSizeTextType="uniform"
                  android:maxLines="1"
                  android:text="@string/widget_default_balance"
                  android:textColor="#FFFFFF"
                  android:textSize="22sp"
                  android:textStyle="bold" />
          </LinearLayout>
          FT_EOF
          mkdir -p "$P/app/src/main/res/mipmap-anydpi-v26"
          cat > "$P/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" <<'FT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          FT_EOF
          mkdir -p "$P/app/src/main/res/values"
          cat > "$P/app/src/main/res/values/colors.xml" <<'FT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#4F46E5</color>
          </resources>
          FT_EOF
          mkdir -p "$P/app/src/main/res/values"
          cat > "$P/app/src/main/res/values/strings.xml" <<'FT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Financial Tracker</string>
          </resources>
          FT_EOF
          mkdir -p "$P/app/src/main/res/values"
          cat > "$P/app/src/main/res/values/widget_strings.xml" <<'FT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="widget_label">Sisa Saldo</string>
              <string name="widget_default_balance">Rp 0</string>
              <string name="widget_description">Menampilkan sisa saldo Financial Tracker</string>
          </resources>
          FT_EOF
          mkdir -p "$P/app/src/main/res/xml"
          cat > "$P/app/src/main/res/xml/balance_widget_info.xml" <<'FT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/widget_description"
              android:initialLayout="@layout/widget_balance"
              android:minWidth="110dp"
              android:minHeight="110dp"
              android:minResizeWidth="110dp"
              android:minResizeHeight="40dp"
              android:resizeMode="horizontal|vertical"
              android:updatePeriodMillis="0" />
          FT_EOF
          mkdir -p "$P"
          cat > "$P/build.gradle" <<'FT_EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          FT_EOF
          mkdir -p "$P"
          cat > "$P/gradle.properties" <<'FT_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          FT_EOF
          mkdir -p "$P"
          cat > "$P/settings.gradle" <<'FT_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FinancialTracker"
          include ':app'
          FT_EOF
          mkdir -p "$P/app/src/main/assets"
          cp index.html "$P/app/src/main/assets/index.html"
          find "$P" -type f | sort

      - name: Bangun APK
        working-directory: android-project
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Siapkan file APK
        run: |
          cp android-project/app/build/outputs/apk/debug/app-debug.apk Financial-Tracker.apk
          ls -l Financial-Tracker.apk

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: Financial-Tracker-APK
          path: Financial-Tracker.apk

      - name: Terbitkan APK di halaman Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Financial-Tracker.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Financial Tracker - build ${{ github.run_number }}" \
            --notes "APK debug Financial Tracker dengan widget Sisa Saldo."
